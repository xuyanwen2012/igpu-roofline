# Formatting on commit. Install once per checkout: `uv run pre-commit install`.
# Hooks use the project's pinned ruff (uv dev group) and the system clang-format
# (the same binary clangd uses), so editor and commit formatting agree.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check --fix
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: clang-format
        name: clang-format
        entry: clang-format -i
        language: system
        types_or: [c, c++]
        # Runner sources only: third_party is vendored, and reformatting shaders
        # would change their SPIR-V hashes, which key results.
        files: ^runner/
