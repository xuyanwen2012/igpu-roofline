[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igpu-roofline"
version = "0.1.0"
description = "Vulkan roofline microbenchmarks for Android and integrated GPUs"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8", "numpy>=1.26", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
igpu-roofline = "igpu_roofline.cli:main"

[tool.setuptools]
packages = ["igpu_roofline"]
