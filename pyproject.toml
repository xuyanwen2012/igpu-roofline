[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "igpu-roofline"
version = "0.1.0"
description = "Vulkan roofline microbenchmarks for Android and integrated GPUs"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8", "numpy>=1.26", "pyyaml>=6"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16", "ty>=0.0.84", "pre-commit>=4"]

[project.scripts]
igpu-roofline = "igpu_roofline.cli:main"

[tool.setuptools]
packages = ["igpu_roofline"]

[tool.ruff]
target-version = "py310"
line-length = 88
# results/ holds archived run artifacts (the scripts exactly as they ran); keep them byte-identical.
extend-exclude = ["third_party", "results"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PL"]
ignore = [
    "E501",     # long strings (report prose) are wrapped by hand; the formatter handles code
    "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",  # complexity / magic-number heuristics
    "PLW1510",  # subprocess.run callers inspect returncode themselves
    "PLC0415",  # lazy imports keep CLI start-up fast
    "PLR0917", "PLW2901", "PLW0108", "PLC3002", "E731",  # style-only
    "RUF001", "RUF002", "RUF003",  # ×, µ, – in report prose are intended
    "B905",     # zip() over parallel lists; strict= needs a behaviour decision per call
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.ty.environment]
python-version = "3.10"

[tool.ty.src]
# results/ holds campaign scripts exactly as they ran (see the ruff note above).
exclude = ["third_party", "build", "results"]

# `min(d, key=d.get)` is correct here; ty cannot match the overload. Kept as a
# config override because igpu_roofline/ must not change while campaigns record.
[[tool.ty.overrides]]
include = ["igpu_roofline/workload.py"]
rules = { no-matching-overload = "ignore" }

[tool.pytest.ini_options]
# Only the repo tests: campaign source snapshots under results/ carry their own tests/.
testpaths = ["tests"]
